<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#scene { width: 100%; height: 100%; perspective: 1800px; perspective-origin: 50% 50%; }
#stage { width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; }
#cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
#energy-canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#glass {
  position: fixed; top: 18px; left: 18px; width: 260px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="scene"><div id="stage">
  <div id="cy"></div>
  <canvas id="energy-canvas"></canvas>
</div></div>

<div id="glass">
  <h1>Trust Exchange</h1>
  <p class="hint">Click a node to focus · Click background to reset</p>
  <div class="legend">
    <div class="item"><div class="dot" style="background:#38bdf8"></div>Participant</div>
    <div class="item"><div class="dot" style="background:#00ffa6"></div>Skill</div>
    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>
  </div>
</div>

<script>
const glass = document.getElementById('glass');
let hideT = setTimeout(() => glass.classList.add('hidden'), 3500);
glass.addEventListener('mouseenter', () => { clearTimeout(hideT); glass.classList.remove('hidden'); });
glass.addEventListener('mouseleave', () => { hideT = setTimeout(() => glass.classList.add('hidden'), 2000); });

const HOVER_SIZE = 115;
const LINE_COLORS = { skill:'#00ffa6', trust:'#ffb347', fairness:'#ff4fa3' };

    { data:{ id:'verification',  label:'Verification',  type:'trust' }, position:{ x:1100, y:40 } },

    { data:{ id:'balanced',     label:'Balanced',     type:'fairness' }, position:{ x:950,  y:1450 } },
    { data:{ id:'agreement',    label:'Agreement',    type:'fairness' }, position:{ x:1250, y:1450 } },
    { data:{ id:'worthit',      label:'Worth It',     type:'fairness' }, position:{ x:1550, y:1450 } },
    { data:{ id:'consistency',  label:'Consistency',  type:'fairness' }, position:{ x:1850, y:1450 } },
    { data:{ id:'expectations', label:'Expectations', type:'fairness' }, position:{ x:2150, y:1450 } },
    { data:{ source:'alex',    target:'resume',       line:'skill'    } },
    { data:{ source:'alex',    target:'calc',         line:'skill'    } },
    { data:{ source:'alex',    target:'reviews',      line:'trust'    } },

    { data:{ source:'maria',   target:'balanced',     line:'fairness' } },
    { data:{ source:'daniel',  target:'repair',       line:'skill'    } },
    { data:{ source:'daniel',  target:'wifi',         line:'skill'    } },
    { data:{ source:'daniel',  target:'verification', line:'trust'    } },
    { data:{ source:'daniel',  target:'agreement',    line:'fairness' } },
    { data:{ source:'jasmine', target:'homework',     line:'skill'    } },
    { data:{ source:'jasmine', target:'notes',        line:'skill'    } },
    { data:{ source:'jasmine', target:'worthit',      line:'fairness' } },
    { data:{ source:'kevin',   target:'bookkeeping',  line:'skill'    } },
    { data:{ source:'kevin',   target:'consulting',   line:'skill'    } },
    { data:{ source:'kevin',   target:'marketing',    line:'skill'    } },
    { data:{ source:'kevin',   target:'trackrecord',  line:'trust'    } },
    { data:{ source:'lina',    target:'photoshoots',  line:'skill'    } },
    { data:{ source:'lina',    target:'communication',line:'trust'    } },
    { data:{ source:'lina',    target:'expectations', line:'fairness' } },
    { data:{ source:'marcus',  target:'gym',          line:'skill'    } },
    { data:{ source:'marcus',  target:'consistency',  line:'fairness' } },
    { data:{ source:'emily',   target:'reputation',   line:'trust'    } },
    { data:{ source:'robert',  target:'verification', line:'trust'    } },
    { data:{ source:'robert',  target:'agreement',    line:'fairness' } },
    { data:{ source:'linda',   target:'communication',line:'trust'    } },
    { data:{ source:'linda',   target:'expectations', line:'fairness' } }
  ],
  style: [
    { selector: 'node', style: {
      'label': 'data(label)', 'font-size': 11, 'font-weight': 600,
      'text-wrap': 'wrap', 'text-max-width': '100px',
      'color': 'white', 'text-outline-width': 3, 'text-outline-color': '#000',
      'text-valign': 'center', 'text-halign': 'center',
      'border-width': 2, 'border-color': 'rgba(255,255,255,0.15)',
      'transition-property': 'opacity, width, height, font-size, text-outline-width, border-width',
      'transition-duration': '300ms'
    }},
    { selector: 'node[type="participant"]', style: { 'background-color': '#38bdf8', 'width': 90, 'height': 90, 'shadow-color': '#38bdf8', 'shadow-blur': 40, 'shadow-opacity': 1 }},
    { selector: 'node[type="skill"]',       style: { 'background-color': '#00ffa6', 'width': 34, 'height': 34, 'shadow-color': '#00ffa6', 'shadow-blur': 18, 'shadow-opacity': 0.8 }},
    { selector: 'node[type="trust"]',       style: { 'background-color': '#ffb347', 'width': 42, 'height': 42, 'shadow-color': '#ffb347', 'shadow-blur': 25, 'shadow-opacity': 0.9 }},
    { selector: 'node[type="fairness"]',    style: { 'background-color': '#ff4fa3', 'width': 42, 'height': 42, 'shadow-color': '#ff4fa3', 'shadow-blur': 25, 'shadow-opacity': 0.9 }},
    { selector: 'edge', style: {
      'curve-style': 'segments',
      'segment-distances': '40 -40 40', 'segment-weights': '0.2 0.5 0.8',
      'width': 5, 'opacity': 0.85, 'line-cap': 'round'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6', 'shadow-color': '#00ffa6', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347', 'shadow-color': '#ffb347', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3', 'shadow-color': '#ff4fa3', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: '.dim',        style: { 'opacity': 0.06, 'text-opacity': 0 }},
    { selector: '.focus-node', style: { 'opacity': 1, 'font-size': 15, 'font-weight': 800, 'text-outline-width': 4, 'border-width': 4, 'border-color': 'rgba(255,255,255,0.7)', 'text-opacity': 1 }},
    { selector: '.focus-edge', style: { 'opacity': 1, 'width': 7 }},
    { selector: '.hovered',    style: { 'font-size': 17, 'font-weight': 900, 'text-outline-width': 5, 'color': '#ffffff', 'text-opacity': 1, 'border-width': 4, 'border-color': 'rgba(255,255,255,0.9)' }}
  ],
  layout: { name: 'preset' }
});

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('energy-canvas');
const ctx    = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function toScreen(pos) {
  const p = cy.pan(), z = cy.zoom();
  return { x: pos.x * z + p.x, y: pos.y * z + p.y };
}
function getBaseSize(n) { return BASE[n.data('type')] || 42; }

// ─── Build polyline points along edge (matches cytoscape 'segments' style) ───
function buildPolyline(edge) {
  const src = edge.source().position();
  const tgt = edge.target().position();
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = -dy/len, py = dx/len;
  // weights & distances mirror the cytoscape style above
  const W = [0.2, 0.5, 0.8], D = [40, -40, 40];
  const pts = [{ x: src.x, y: src.y }];
  for (let i = 0; i < 3; i++)
    pts.push({ x: src.x + W[i]*dx + D[i]*px, y: src.y + W[i]*dy + D[i]*py });
  pts.push({ x: tgt.x, y: tgt.y });
  return pts;
}

// ─── Arc-length table so we can walk t=0..1 uniformly along the polyline ─────
function buildArcTable(pts) {
  const segs = []; let cum = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i+1].x - pts[i].x, dy = pts[i+1].y - pts[i].y;
    const d = Math.sqrt(dx*dx + dy*dy);
    cum += d;
    segs.push({ from: i, d, cum });
  }
  return { segs, total: cum };
}

// Return screen-space point at arc-fraction t (0=start, 1=end) of polyline
function walkArc(pts, arc, t) {
  const target = Math.max(0, Math.min(1, t)) * arc.total;
  let prev = 0;
  for (let s = 0; s < arc.segs.length; s++) {
    const seg = arc.segs[s];
    if (target <= seg.cum || s === arc.segs.length - 1) {
      const f = seg.d > 0 ? (target - prev) / seg.d : 0;
      const i = seg.from;
      const worldPt = {
        x: pts[i].x + f * (pts[i+1].x - pts[i].x),
        y: pts[i].y + f * (pts[i+1].y - pts[i].y)
      };
      return toScreen(worldPt);
    }
    prev = seg.cum;
  }
  return toScreen(pts[pts.length-1]);
}

// ─── Draw ONE edge's flow pulse ───────────────────────────────────────────────
// pulseT  : 0→1, fraction of the journey completed (linear, driven by clock)
// color   : hex string like '#00ffa6'
// edgePx  : rendered edge width in screen pixels
function drawEdgePulse(pts, arc, pulseT, color, edgePx) {
  // The lit window spans ±HALF around the center.
  // We sample STEPS screen-space segments and paint each with its own opacity.
  const HALF  = 0.18;  // half-width of lit window in arc-fraction
  const STEPS = 60;
  const cx_   = pulseT; // center of window

  // Collect screen points for the window
  const screenPts = [];
  for (let i = 0; i <= STEPS; i++) {
    const t = cx_ - HALF + (i / STEPS) * (HALF * 2);
    screenPts.push({ t, pt: walkArc(pts, arc, t) });
  }

  // Draw each sub-segment with bell-curve brightness
  for (let i = 0; i < screenPts.length - 1; i++) {
    const { t: tA, pt: pA } = screenPts[i];
    const { t: tB, pt: pB } = screenPts[i+1];

    // skip segments outside 0..1 arc range
    if (tB < 0 || tA > 1) continue;

    const tMid = (tA + tB) / 2;
    const dist  = Math.abs(tMid - cx_) / HALF;        // 0=center, 1=edge
    const bell  = Math.max(0, 1 - dist * dist);       // quadratic bell
    const fade  = cx_ > 0.82 ? (1 - cx_) / 0.18 : 1; // dissolve into target node
    const enter = cx_ < 0.12 ? cx_ / 0.12 : 1;       // emerge from source node
    const alpha = bell * fade * enter;
    if (alpha < 0.01) continue;

    // Parse hex color once
    const r = parseInt(color.slice(1,3),16);
    const g = parseInt(color.slice(3,5),16);
    const b = parseInt(color.slice(5,7),16);

    ctx.save();
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';
    // Bright white-ish core + colored outer glow in two passes
    // Pass 1: wide soft glow
    ctx.lineWidth   = edgePx * (1.4 + bell * 1.2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.55})`;
    ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
    // Pass 2: bright core — slightly narrower, more opaque
    ctx.lineWidth   = edgePx * (0.55 + bell * 0.6);
    ctx.strokeStyle = `rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},${alpha * 0.95})`;
    ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
    ctx.restore();
  }
}

// ─── Active state ─────────────────────────────────────────────────────────────
let focusActive   = false;
let hoveredNode   = null;
let rafId         = null;
let pulseTimers   = [];
let activeEdges   = []; // { pts, arc, color, reversed }
let phaseStart    = 0;
let pulsePhase    = 'idle'; // 'running' | 'gap' | 'idle'

const PULSE_DUR = 1.3;  // seconds for one sweep
const PULSE_GAP = 0.55; // seconds of silence between sweeps

function stopPulse() {
  pulseTimers.forEach(clearInterval); pulseTimers = [];
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function startFocusPulse(focusedEdges, clickedNode) {
  stopPulse();
  activeEdges = [];
  focusedEdges.forEach(edge => {
    const pts  = buildPolyline(edge);
    // If the clicked node is the TARGET (not source), reverse so pulse flows away from it
    const reversed = edge.target().id() === clickedNode.id();
    const orderedPts = reversed ? pts.slice().reverse() : pts;
    const arc  = buildArcTable(orderedPts);
    const color = LINE_COLORS[edge.data('line')] || '#ffffff';
    activeEdges.push({ pts: orderedPts, arc, color });
  });

  pulsePhase = 'running';
  phaseStart = performance.now();

  function tick(now) {
    rafId = requestAnimationFrame(tick);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const elapsed = (now - phaseStart) / 1000;

    if (pulsePhase === 'running') {
      const t = Math.min(1, elapsed / PULSE_DUR);
      const zoom = cy.zoom();
      const edgePx = 7 * zoom;
      activeEdges.forEach(({ pts, arc, color }) => {
        drawEdgePulse(pts, arc, t, color, edgePx);
      });
      if (t >= 1) { pulsePhase = 'gap'; phaseStart = now; }
    } else {
      // gap — canvas stays blank
      if (elapsed >= PULSE_GAP) { pulsePhase = 'running'; phaseStart = now; }
    }
  }
  rafId = requestAnimationFrame(tick);
}

// ─── Idle glow ────────────────────────────────────────────────────────────────
function startIdleGlow() {
  stopPulse();
  let ph = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    ph += 0.025;
    cy.nodes().forEach(n => {
      if (n === hoveredNode) return;
      const base = getBaseSize(n) * 0.38;
      n.style('shadow-blur', (base + Math.sin(ph + n.position('x') * 0.002) * 9).toString());
    });
  }, 60);
  pulseTimers.push(id);
}

// ─── 3-D drift ────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let driftPh = 0;
(function driftLoop() {
  requestAnimationFrame(driftLoop);
  driftPh += 0.00028;
  stage.style.transform =
    `rotateX(${6*Math.sin(driftPh)}deg) rotateY(${9*Math.sin(driftPh*0.7+1.1)}deg)`;
})();

// ─── Click focus ──────────────────────────────────────────────────────────────
cy.on('tap', 'node', function(evt) {
  const clicked = evt.target;
  if (focusActive && clicked.hasClass('focus-node') && !clicked.hasClass('dim')) {
    resetAll(); return;
  }

  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  const visited = new Set([clicked.id()]);
  const queue   = [clicked];
  let focNodes  = cy.collection();
  let focEdges  = cy.collection();

  clicked.removeClass('dim').addClass('focus-node');
  focNodes = focNodes.merge(clicked);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id()); queue.push(n);
          n.removeClass('dim').addClass('focus-node');
          focNodes = focNodes.merge(n);
        }
      });
      edge.removeClass('dim').addClass('focus-edge');
      focEdges = focEdges.merge(edge);
    });
  }

  focusActive = true;
  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.12;
  cy.animate({ fit: { eles: focNodes, padding: pad } },
             { duration: 600, easing: 'ease-in-out-cubic' });
  startFocusPulse(focEdges, clicked);
});

cy.on('tap', e => { if (e.target === cy) resetAll(); });

function resetAll() {
  stopPulse();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().forEach(n => { n.style('shadow-blur', ''); n.style('border-width', '2'); });
  focusActive = false;
  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.07;
  cy.animate({ fit: { eles: cy.nodes(), padding: pad } },
             { duration: 500, easing: 'ease-in-out-cubic' });
  startIdleGlow();
}

// ─── Hover ────────────────────────────────────────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const n = evt.target; hoveredNode = n;
  if (n.hasClass('dim')) return;
  n.addClass('hovered');
  const big = n.data('type') === 'participant' ? HOVER_SIZE+20 : HOVER_SIZE;
  n.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});
cy.on('mouseout', 'node', function(evt) {
  const n = evt.target; hoveredNode = null;
  n.removeClass('hovered');
  n.stop().animate({ style: { width: getBaseSize(n), height: getBaseSize(n) } }, { duration: 180 });
});

startIdleGlow();
</script>
</body>
</html>
