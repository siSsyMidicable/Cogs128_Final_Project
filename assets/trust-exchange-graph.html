<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
/* Canvas sits on top of cy but pointer-events:none so clicks pass through */
#energy-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#glass {
  position: absolute; top: 18px; left: 18px; width: 250px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }

    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>

    }},

    }},
    { selector: 'node[type="fairness"]', style: {

    }},
    { selector: 'edge', style: {
      'curve-style': 'segments',
      'segment-distances': '40 -40 40', 'segment-weights': '0.2 0.5 0.8',
      'width': 5, 'opacity': 0.85, 'line-cap': 'round',
      'transition-property': 'opacity, width', 'transition-duration': '300ms'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6', 'shadow-color': '#00ffa6', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347', 'shadow-color': '#ffb347', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3', 'shadow-color': '#ff4fa3', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: '.dim', style: { 'opacity': 0.05, 'text-opacity': 0 } },
    { selector: '.focus-node', style: {
      'opacity': 1, 'font-size': 15, 'font-weight': 800,

    }},

// ─── Canvas overlay for energy particles ──────────────────────────────────────
const canvas = document.getElementById('energy-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Convert a Cytoscape model position to screen pixel coords
function modelToScreen(pos) {
  const pan  = cy.pan();
  const zoom = cy.zoom();
  return { x: pos.x * zoom + pan.x, y: pos.y * zoom + pan.y };
}

// ─── State ────────────────────────────────────────────────────────────────────
let focusActive   = false;
let pulseTimers   = [];
let hoveredNode   = null;
let activeEdges   = [];    // edge objects currently flowing energy
let breathPhase   = 0;     // shared phase for ALL active node breaths
let particles     = [];    // [{t, edge, color, radius, speed}]
let rafId         = null;  // requestAnimationFrame handle

// ─── Helpers ──────────────────────────────────────────────────────────────────
function getBaseSize(node) { return BASE[node.data('type')] || 42; }

function stopAllPulse() {
  pulseTimers.forEach(id => clearInterval(id));
  pulseTimers = [];
}

function stopParticles() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  particles = [];
  activeEdges = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ─── BREATH + ENERGY FLOW LOOP ───────────────────────────────────────────────
// Called once after a node is selected.
// `focusedNodes`  – cy collection of lit nodes
// `focusedEdges`  – cy collection of lit edges
function startEnergyLoop(focusedNodes, focusedEdges) {
  stopAllPulse();
  stopParticles();

  breathPhase = 0;
  activeEdges = focusedEdges.toArray();

  // Spawn one particle per edge, staggered
  activeEdges.forEach((edge, i) => {
    const color = LINE_COLORS[edge.data('line')] || '#ffffff';
    particles.push({
      t:      i / activeEdges.length,  // stagger start positions
      edge,
      color,
      radius: 5,
      speed:  0.004 + Math.random() * 0.003  // each particle slightly different pace
    });
    // also add a second trailing particle per edge for richness
    particles.push({
      t:      (i / activeEdges.length + 0.5) % 1,
      edge,
      color,
      radius: 3.5,
      speed:  0.003 + Math.random() * 0.002
    });
  });

  function tick() {
    rafId = requestAnimationFrame(tick);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ── Advance breath ──────────────────────────────────────────
    breathPhase += 0.045;  // ~2.8 sec per full breath at 60fps
    const breathSin = Math.sin(breathPhase);  // -1 → +1

    // ── Pulse focused nodes in sync with breathSin ──────────────
    focusedNodes.forEach(n => {
      if (n.hasClass('dim')) return;
      const base = getBaseSize(n);
      // shadow grows/shrinks with breath
      n.style('shadow-blur',  (base * 0.5 + breathSin * base * 0.45).toString());
      // border width breathes 2 → 6
      n.style('border-width', (4 + breathSin * 2).toString());
    });

    // ── Draw energy particles ───────────────────────────────────
    particles.forEach(p => {
      // speed is modulated by breath: fast on exhale (sin > 0), slow on inhale
      const breathSpeed = p.speed * (1 + breathSin * 0.6);
      p.t = (p.t + breathSpeed) % 1;

      // Get endpoint screen coords
      const src = p.edge.source();
      const tgt = p.edge.target();
      if (!src || !tgt) return;

      const sp = modelToScreen(src.position());
      const tp = modelToScreen(tgt.position());

      // Lerp along the straight line (matches the visual edge closely enough)
      const px = sp.x + (tp.x - sp.x) * p.t;
      const py = sp.y + (tp.y - sp.y) * p.t;

      // Particle glows brighter on exhale (breathSin > 0)
      const alpha = 0.55 + breathSin * 0.35;
      const r     = p.radius * (0.85 + breathSin * 0.3);

      // Draw glowing dot
      const grad = ctx.createRadialGradient(px, py, 0, px, py, r * 3.5);
      grad.addColorStop(0,   hexAlpha(p.color, alpha));
      grad.addColorStop(0.4, hexAlpha(p.color, alpha * 0.6));
      grad.addColorStop(1,   hexAlpha(p.color, 0));
      ctx.beginPath();
      ctx.arc(px, py, r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Bright core
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = hexAlpha('#ffffff', alpha * 0.9);
      ctx.fill();
    });
  }

  rafId = requestAnimationFrame(tick);
}

// ─── IDLE PULSE (no selection) ────────────────────────────────────────────────
function startIdlePulse() {
  stopAllPulse();
  stopParticles();
  let phase = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    phase += 0.025;
    cy.nodes().forEach(n => {
      if (n !== hoveredNode) {
        const base = getBaseSize(n) * 0.4;
        n.style('shadow-blur', (base + Math.sin(phase + n.position('x') * 0.002) * 10).toString());
      }
    });
  }, 60);
  pulseTimers.push(id);
}

// ─── CLICK: focus + dim + pan/fit + energy flow ───────────────────────────────
cy.on('tap', 'node', function(evt) {
  const start = evt.target;

  if (focusActive && start.hasClass('focus-node') && !start.hasClass('dim')) {
    resetAll(); return;
  }

  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  // BFS to find all connected nodes + edges
  const visited = new Set([start.id()]);
  const queue   = [start];
  let focNodes  = cy.collection();
  let focEdges  = cy.collection();

  start.removeClass('dim').addClass('focus-node');
  focNodes = focNodes.merge(start);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id());
          queue.push(n);
          n.removeClass('dim').addClass('focus-node');
          focNodes = focNodes.merge(n);
        }
      });
      edge.removeClass('dim').addClass('focus-edge');
      focEdges = focEdges.merge(edge);
    });
  }

  focusActive = true;

  // ── Auto pan + fit to selected subgraph, perfectly sized for viewport ──
  cy.animate({
    fit: {
      eles: focNodes,
      padding: Math.min(window.innerWidth, window.innerHeight) * 0.12
    }
  }, {
    duration: 550,
    easing: 'ease-in-out-cubic'
  });

  // Start energy loop (breath + particles)
  startEnergyLoop(focNodes, focEdges);
});

// ─── BACKGROUND TAP: reset ────────────────────────────────────────────────────
cy.on('tap', function(e) {
  if (e.target === cy) resetAll();
});

function resetAll() {
  stopAllPulse();
  stopParticles();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  // Reset all node sizes/glows to base
  cy.nodes().forEach(n => {
    n.style('shadow-blur', '');
    n.style('border-width', '2');
  });
  focusActive = false;
  // Fit everything back into view
  cy.animate({ fit: { eles: cy.nodes(), padding: 60 } }, { duration: 500, easing: 'ease-in-out-cubic' });
  startIdlePulse();
}

// ─── HOVER ────────────────────────────────────────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = node;
  if (node.hasClass('dim')) return;
  node.addClass('hovered');
  const big = node.data('type') === 'participant' ? 120 : 90;
  node.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});

cy.on('mouseout', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = null;
  node.removeClass('hovered');
  node.stop().animate({ style: { width: getBaseSize(node), height: getBaseSize(node) } }, { duration: 180 });
});

// ─── Utility: hex color + alpha → rgba string ────────────────────────────────
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
startIdlePulse();
</script>
