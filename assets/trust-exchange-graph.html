<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#scene { width: 100%; height: 100%; perspective: 1800px; perspective-origin: 50% 50%; }
#stage { width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; }
#cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
#energy-canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#glass {
  position: fixed; top: 18px; left: 18px; width: 260px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="scene"><div id="stage">
  <div id="cy"></div>
  <canvas id="energy-canvas"></canvas>
</div></div>

<div id="glass">
  <h1>Trust Exchange</h1>
  <p class="hint">Click a node to focus · Click background to reset</p>
  <div class="legend">
    <div class="item"><div class="dot" style="background:#38bdf8"></div>Participant</div>
    <div class="item"><div class="dot" style="background:#00ffa6"></div>Skill</div>
    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>
  </div>
</div>

<script>
const glass = document.getElementById('glass');
let hideT = setTimeout(() => glass.classList.add('hidden'), 3500);
glass.addEventListener('mouseenter', () => { clearTimeout(hideT); glass.classList.remove('hidden'); });
glass.addEventListener('mouseleave', () => { hideT = setTimeout(() => glass.classList.add('hidden'), 2000); });

const HOVER_SIZE  = 115;
const LINE_COLORS = { skill:'#00ffa6', trust:'#ffb347', fairness:'#ff4fa3' };
// How wide (in arc-fraction) the glowing window is on the track
const PULSE_WIDTH = 0.22;
// Seconds for one pulse to travel the full edge length
const PULSE_DURATION = 1.1;
// Gap between pulses (seconds) — after one finishes, wait this long before next
const PULSE_GAP = 0.7;

const cy = cytoscape({

    { data:{ id:'worthit',      label:'Worth It',     type:'fairness' }, position:{ x:1550, y:1450 } },

    { data:{ source:'alex',    target:'resume',       line:'skill'    } },

    { data:{ source:'jasmine', target:'worthit',      line:'fairness' } },
    { data:{ source:'kevin',   target:'bookkeeping',  line:'skill'    } },
    { data:{ source:'kevin',   target:'consulting',   line:'skill'    } },
    { data:{ source:'kevin',   target:'marketing',    line:'skill'    } },
    { data:{ source:'kevin',   target:'trackrecord',  line:'trust'    } },
    { data:{ source:'lina',    target:'photoshoots',  line:'skill'    } },
    { data:{ source:'lina',    target:'communication',line:'trust'    } },
    { data:{ source:'lina',    target:'expectations', line:'fairness' } },
    { data:{ source:'marcus',  target:'gym',          line:'skill'    } },
    { data:{ source:'marcus',  target:'consistency',  line:'fairness' } },
    { data:{ source:'emily',   target:'reputation',   line:'trust'    } },
    { data:{ source:'robert',  target:'verification', line:'trust'    } },
    { data:{ source:'robert',  target:'agreement',    line:'fairness' } },
    { data:{ source:'linda',   target:'communication',line:'trust'    } },
    { data:{ source:'linda',   target:'expectations', line:'fairness' } }
  ],
  style: [
    { selector: 'node', style: {
      'label': 'data(label)', 'font-size': 11, 'font-weight': 600,
      'text-wrap': 'wrap', 'text-max-width': '100px',
      'color': 'white', 'text-outline-width': 3, 'text-outline-color': '#000',
      'text-valign': 'center', 'text-halign': 'center',
      'border-width': 2, 'border-color': 'rgba(255,255,255,0.15)',
      'transition-property': 'opacity, width, height, font-size, text-outline-width, border-width, shadow-blur',
      'transition-duration': '300ms'
    }},
    { selector: 'node[type="participant"]', style: { 'background-color': '#38bdf8', 'width': 90, 'height': 90, 'shadow-color': '#38bdf8', 'shadow-blur': 40, 'shadow-opacity': 1 }},
    { selector: 'node[type="skill"]',       style: { 'background-color': '#00ffa6', 'width': 34, 'height': 34, 'shadow-color': '#00ffa6', 'shadow-blur': 18, 'shadow-opacity': 0.8 }},
    { selector: 'node[type="trust"]',       style: { 'background-color': '#ffb347', 'width': 42, 'height': 42, 'shadow-color': '#ffb347', 'shadow-blur': 25, 'shadow-opacity': 0.9 }},
    { selector: 'node[type="fairness"]',    style: { 'background-color': '#ff4fa3', 'width': 42, 'height': 42, 'shadow-color': '#ff4fa3', 'shadow-blur': 25, 'shadow-opacity': 0.9 }},
    { selector: 'edge', style: {
      'curve-style': 'segments',
      'segment-distances': '40 -40 40', 'segment-weights': '0.2 0.5 0.8',
      'width': 5, 'opacity': 0.85, 'line-cap': 'round',
      'transition-property': 'opacity, width, shadow-blur', 'transition-duration': '300ms'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6', 'shadow-color': '#00ffa6', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347', 'shadow-color': '#ffb347', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3', 'shadow-color': '#ff4fa3', 'shadow-blur': 10, 'shadow-opacity': 0.5 }},
    { selector: '.dim',        style: { 'opacity': 0.06, 'text-opacity': 0 }},
    { selector: '.focus-node', style: { 'opacity': 1, 'font-size': 15, 'font-weight': 800, 'text-outline-width': 4, 'text-outline-color': '#000', 'color': '#ffffff', 'border-width': 4, 'border-color': 'rgba(255,255,255,0.7)', 'shadow-blur': 60, 'shadow-opacity': 1, 'text-opacity': 1 }},
    { selector: '.focus-edge', style: { 'opacity': 1, 'width': 7, 'shadow-blur': 20, 'shadow-opacity': 0.9 }},
    { selector: '.hovered',    style: { 'font-size': 17, 'font-weight': 900, 'text-outline-width': 5, 'text-outline-color': '#000', 'color': '#ffffff', 'text-opacity': 1, 'border-width': 4, 'border-color': 'rgba(255,255,255,0.9)', 'shadow-blur': 70, 'shadow-opacity': 1 }}
  ],
  layout: { name: 'preset' }
});

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('energy-canvas');
const ctx    = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function toScreen(pos) {
  const p = cy.pan(), z = cy.zoom();
  return { x: pos.x * z + p.x, y: pos.y * z + p.y };
}
function hexRGB(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function getBaseSize(n) { return BASE[n.data('type')] || 42; }

// ─── Polyline helpers ─────────────────────────────────────────────────────────
function buildEdgePolyline(edge) {
  const src = edge.source().position();
  const tgt = edge.target().position();
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = -dy/len, py = dx/len;
  const weights = [0.2, 0.5, 0.8], dists = [40, -40, 40];
  const pts = [{ x: src.x, y: src.y }];
  for (let i = 0; i < 3; i++)
    pts.push({ x: src.x + weights[i]*dx + dists[i]*px, y: src.y + weights[i]*dy + dists[i]*py });
  pts.push({ x: tgt.x, y: tgt.y });
  return pts;
}
function buildArcTable(pts) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x-pts[i-1].x, dy = pts[i].y-pts[i-1].y;
    const d = Math.sqrt(dx*dx+dy*dy);
    total += d; segs.push({ len:d, cumLen:total });
  }
  return { segs, total };
}
function evalPolyline(pts, arc, t) {
  const target = t * arc.total; let prev = 0;
  for (let i = 0; i < arc.segs.length; i++) {
    const { len, cumLen } = arc.segs[i];
    if (target <= cumLen || i === arc.segs.length-1) {
      const f = len > 0 ? (target-prev)/len : 0;
      return { x: pts[i].x + f*(pts[i+1].x-pts[i].x), y: pts[i].y + f*(pts[i+1].y-pts[i].y) };
    }
    prev = cumLen;
  }
  return pts[pts.length-1];
}

// ─── State ────────────────────────────────────────────────────────────────────
let focusActive = false;
let pulseTimers = [];
let hoveredNode = null;
let rafId       = null;
let activeEdgeData  = []; // built once per focus click
let pulseStartTime  = null; // performance.now() when current pulse started
let pulsePhase      = 'running'; // 'running' | 'gap'
let phaseStartTime  = null;

function stopAllPulse() { pulseTimers.forEach(clearInterval); pulseTimers = []; }
function stopRAF() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ─── Draw flowing pulse — NO beam, NO back-and-forth ─────────────────────────
// A glowing window (PULSE_WIDTH wide in arc-fraction) sweeps from 0→1 once,
// fades out at the end, then restarts after a gap. The "window" is drawn by
// walking the polyline and painting stroked segments whose opacity follows
// a smooth bell-curve based on distance from the pulse center.
function drawFlowPulse(edgeData, pulseT, zoom) {
  // pulseT: 0.0 = pulse center just left the source
  //         1.0 = pulse center just reached the target
  // We extend range slightly so the tail enters cleanly and head exits cleanly
  const centerT = pulseT; // 0→1 linearly, driven by clock
  const { pts, arc, rgb, edgeWidthPx } = edgeData;
  const [r, g, b] = rgb;

  // How many sample segments to paint along the window
  const STEPS = 40;
  const hw = (edgeWidthPx * zoom) / 2; // half edge width in screen px

  for (let i = 0; i <= STEPS; i++) {
    // fractional position of this sample along the full arc
    const sampleT = centerT - PULSE_WIDTH/2 + (i/STEPS) * PULSE_WIDTH;
    const nextT   = centerT - PULSE_WIDTH/2 + ((i+1)/STEPS) * PULSE_WIDTH;
    if (sampleT < 0 || nextT > 1.02) continue;
    const clampedA = Math.max(0, Math.min(1, sampleT));
    const clampedB = Math.max(0, Math.min(1, nextT));
    if (clampedA >= clampedB) continue;

    const wA = evalPolyline(pts, arc, clampedA);
    const wB = evalPolyline(pts, arc, clampedB);
    const sA = toScreen(wA);
    const sB = toScreen(wB);

    // Bell-curve opacity: brightest at center, zero at edges of window
    // We use sampleT's distance from centerT, normalized by half-width
    const distFromCenter = Math.abs((sampleT - centerT) / (PULSE_WIDTH / 2));
    // smoothstep fade: 0 at edge (dist=1), 1 at center (dist=0)
    const bell = Math.max(0, 1 - distFromCenter * distFromCenter);

    // Also fade out the whole pulse as it reaches the end (so it dissolves into the node)
    const endFade = centerT > 0.75 ? Math.max(0, (1 - centerT) / 0.25) : 1;
    // And fade in as it leaves the source
    const startFade = centerT < 0.1 ? centerT / 0.1 : 1;

    const alpha = bell * endFade * startFade * 0.9;
    if (alpha < 0.01) continue;

    ctx.save();
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    // Width tapers at ends of window too
    ctx.lineWidth = hw * 2 * (0.5 + bell * 0.5);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sA.x, sA.y);
    ctx.lineTo(sB.x, sB.y);
    ctx.stroke();
    ctx.restore();
  }
}

// ─── Energy loop ──────────────────────────────────────────────────────────────
function startEnergyLoop(focusedNodes, focusedEdges, clickedNode) {
  stopAllPulse();
  stopRAF();

  const clickedSize = getBaseSize(clickedNode) / 2;
  activeEdgeData = [];
  focusedEdges.forEach(edge => {
    const src   = edge.source();
    const color = LINE_COLORS[edge.data('line')] || '#ffffff';
    const rgb   = hexRGB(color);
    let pts = buildEdgePolyline(edge);
    if (src.id() !== clickedNode.id()) pts = pts.slice().reverse();
    const arc = buildArcTable(pts);
    activeEdgeData.push({ pts, arc, rgb, edgeWidthPx: 7 });
  });

  pulsePhase = 'running';
  phaseStartTime = performance.now();

  function tick(now) {
    rafId = requestAnimationFrame(tick);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const elapsed = (now - phaseStartTime) / 1000; // seconds

    if (pulsePhase === 'running') {
      // pulseT goes linearly 0→1 over PULSE_DURATION seconds
      const pulseT = Math.min(1, elapsed / PULSE_DURATION);
      const zoom = cy.zoom();
      activeEdgeData.forEach(ed => drawFlowPulse(ed, pulseT, zoom));

      if (pulseT >= 1) {
        // Pulse finished — enter gap phase
        pulsePhase = 'gap';
        phaseStartTime = now;
      }
    } else {
      // Gap phase — canvas stays clear, wait then restart
      if (elapsed >= PULSE_GAP) {
        pulsePhase = 'running';
        phaseStartTime = now;
      }
    }

    // Keep node glow steady while focused (no pulsing, just constant bright)
    focusedNodes.forEach(n => {
      if (n.hasClass('dim')) return;
      const base = getBaseSize(n);
      n.style('shadow-blur', (base * 0.9).toString());
    });
  }

  rafId = requestAnimationFrame(tick);
}

// ─── Idle pulse ───────────────────────────────────────────────────────────────
function startIdlePulse() {
  stopAllPulse();
  stopRAF();
  let phase = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    phase += 0.025;
    cy.nodes().forEach(n => {
      if (n !== hoveredNode) {
        const base = getBaseSize(n) * 0.4;
        n.style('shadow-blur', (base + Math.sin(phase + n.position('x') * 0.002) * 10).toString());
      }
    });
  }, 60);
  pulseTimers.push(id);
}

// ─── 3D drift ─────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let driftPhase = 0;
function driftTick() {
  requestAnimationFrame(driftTick);
  driftPhase += 0.00028;
  stage.style.transform = `rotateX(${6*Math.sin(driftPhase)}deg) rotateY(${9*Math.sin(driftPhase*0.7+1.1)}deg)`;
}
driftTick();

// ─── Click ────────────────────────────────────────────────────────────────────
cy.on('tap', 'node', function(evt) {
  const clicked = evt.target;
  if (focusActive && clicked.hasClass('focus-node') && !clicked.hasClass('dim')) { resetAll(); return; }

  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  const visited = new Set([clicked.id()]);
  const queue   = [clicked];
  let focNodes  = cy.collection();
  let focEdges  = cy.collection();

  clicked.removeClass('dim').addClass('focus-node');
  focNodes = focNodes.merge(clicked);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id()); queue.push(n);
          n.removeClass('dim').addClass('focus-node');
          focNodes = focNodes.merge(n);
        }
      });
      edge.removeClass('dim').addClass('focus-edge');
      focEdges = focEdges.merge(edge);
    });
  }

  focusActive = true;
  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.12;
  cy.animate({ fit: { eles: focNodes, padding: pad } }, { duration: 600, easing: 'ease-in-out-cubic' });
  startEnergyLoop(focNodes, focEdges, clicked);
});

cy.on('tap', function(e) { if (e.target === cy) resetAll(); });

function resetAll() {
  stopAllPulse(); stopRAF();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().forEach(n => { n.style('shadow-blur', ''); n.style('border-width', '2'); });
  focusActive = false;
  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.07;
  cy.animate({ fit: { eles: cy.nodes(), padding: pad } }, { duration: 500, easing: 'ease-in-out-cubic' });
  startIdlePulse();
}

// ─── Hover ────────────────────────────────────────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const node = evt.target; hoveredNode = node;
  if (node.hasClass('dim')) return;
  node.addClass('hovered');
  const big = node.data('type') === 'participant' ? HOVER_SIZE+20 : HOVER_SIZE;
  node.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});
cy.on('mouseout', 'node', function(evt) {
  const node = evt.target; hoveredNode = null;
  node.removeClass('hovered');
  node.stop().animate({ style: { width: getBaseSize(node), height: getBaseSize(node) } }, { duration: 180 });
});

startIdlePulse();
</script>
</body>
