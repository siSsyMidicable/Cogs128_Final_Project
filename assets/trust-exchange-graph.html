<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
#energy-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#glass {
  position: absolute; top: 18px; left: 18px; width: 250px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="cy"></div>
<canvas id="energy-canvas"></canvas>

<div id="glass">
  <h1>Trust Exchange</h1>
  <p class="hint">Click a node to focus · Click background to reset</p>

    <div class="item"><div class="dot" style="background:#38bdf8"></div>Participant</div>
    <div class="item"><div class="dot" style="background:#00ffa6"></div>Skill</div>
    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>
  </div>

<script>

let hideT = setTimeout(() => glass.classList.add('hidden'), 3500);
glass.addEventListener('mouseenter', () => { clearTimeout(hideT); glass.classList.remove('hidden'); });

    { data:{ id:'effort',       label:'Effort',       type:'fairness' }, position:{ x:650,  y:1450 } },
    { data:{ id:'balanced',     label:'Balanced',     type:'fairness' }, position:{ x:950,  y:1450 } },
    { data:{ id:'agreement',    label:'Agreement',    type:'fairness' }, position:{ x:1250, y:1450 } },
    { data:{ id:'worthit',      label:'Worth It',     type:'fairness' }, position:{ x:1550, y:1450 } },
    { data:{ id:'consistency',  label:'Consistency',  type:'fairness' }, position:{ x:1850, y:1450 } },
    { data:{ id:'expectations', label:'Expectations', type:'fairness' }, position:{ x:2150, y:1450 } },
    { data:{ source:'alex',    target:'resume',       line:'skill'    } },
    { data:{ source:'alex',    target:'calc',         line:'skill'    } },
    { data:{ source:'alex',    target:'reviews',      line:'trust'    } },

    { data:{ source:'jasmine', target:'homework',     line:'skill'    } },
    { data:{ source:'jasmine', target:'notes',        line:'skill'    } },
    { data:{ source:'jasmine', target:'worthit',      line:'fairness' } },
    { data:{ source:'kevin',   target:'bookkeeping',  line:'skill'    } },
    { data:{ source:'kevin',   target:'consulting',   line:'skill'    } },
    { data:{ source:'kevin',   target:'marketing',    line:'skill'    } },
    { data:{ source:'kevin',   target:'trackrecord',  line:'trust'    } },
    { data:{ source:'lina',    target:'photoshoots',  line:'skill'    } },

    { data:{ source:'marcus',  target:'gym',          line:'skill'    } },
    { data:{ source:'marcus',  target:'consistency',  line:'fairness' } },
    { data:{ source:'emily',   target:'reputation',   line:'trust'    } },
    { data:{ source:'robert',  target:'verification', line:'trust'    } },
    { data:{ source:'robert',  target:'agreement',    line:'fairness' } },
    { data:{ source:'linda',   target:'communication',line:'trust'    } },
    { data:{ source:'linda',   target:'expectations', line:'fairness' } }
  ],
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'font-size': 13, 'font-weight': 700,

      'text-valign': 'center', 'text-halign': 'center',
      'border-width': 2, 'border-color': 'rgba(255,255,255,0.15)',

    }},
    { selector: 'node[type="participant"]', style: {
      'background-color': '#38bdf8', 'width': 90, 'height': 90,
      'shadow-color': '#38bdf8', 'shadow-blur': 40, 'shadow-opacity': 1
    }},
    { selector: 'node[type="skill"]', style: {
      'background-color': '#00ffa6', 'width': 34, 'height': 34,
      'shadow-color': '#00ffa6', 'shadow-blur': 18, 'shadow-opacity': 0.8
    }},
    { selector: 'node[type="trust"]', style: {
      'background-color': '#ffb347', 'width': 42, 'height': 42,
      'shadow-color': '#ffb347', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    { selector: 'node[type="fairness"]', style: {
      'background-color': '#ff4fa3', 'width': 42, 'height': 42,
      'shadow-color': '#ff4fa3', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    { selector: 'edge', style: {
      'curve-style': 'straight',
      'width': 4, 'opacity': 0.35, 'line-cap': 'round',
      'transition-property': 'opacity, width', 'transition-duration': '300ms'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6' } },
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347' } },
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3' } },
    { selector: '.dim', style: { 'opacity': 0.04, 'text-opacity': 0 } },
    { selector: '.focus-node', style: {
      'opacity': 1, 'font-size': 16, 'font-weight': 800,
      'text-outline-width': 4, 'text-outline-color': '#000',
      'color': '#ffffff', 'border-width': 3,
      'border-color': 'rgba(255,255,255,0.6)', 'text-opacity': 1
    }},
    { selector: '.focus-edge', style: { 'opacity': 0, 'width': 5 } },
    { selector: '.hovered', style: {
      'font-size': 18, 'font-weight': 900,
      'text-outline-width': 5, 'text-outline-color': '#000',
      'color': '#ffffff', 'text-opacity': 1,
      'border-width': 4, 'border-color': 'rgba(255,255,255,0.9)'
    }}
  ],
  layout: { name: 'preset' }
});

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('energy-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function toScreen(pos) {
  const p = cy.pan(), z = cy.zoom();
  return { x: pos.x * z + p.x, y: pos.y * z + p.y };
}

function hexRGB(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// ─── State ────────────────────────────────────────────────────────────────────
let focusActive  = false;
let pulseTimers  = [];
let hoveredNode  = null;
let rafId        = null;
let breathPhase  = 0;

// activeLines: [{ srcPos, tgtPos, color, rgb, originIsSelected }]
// originIsSelected = true if source is the clicked node (draw outward from src→tgt)
let activeLines  = [];
let selectedNode = null;

function getBaseSize(n) { return BASE[n.data('type')] || 42; }
function stopAllPulse() { pulseTimers.forEach(clearInterval); pulseTimers = []; }
function stopRAF() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ─── DRAW EDGE BREATH ────────────────────────────────────────────────────────
// breathT: 0→1 exhale (bright front sweeps toward far end)
//          1→0 inhale  (retreats back to selected node)
// The gradient is painted strictly along the straight line using a
// linear-gradient that goes:  transparent → color (at brightStop) → transparent
// brightStop oscillates with breathT so the glow rides outward then pulls back.
function drawEdgeBreath(line, breathT) {
  const sp = toScreen(line.srcPos);
  const tp = toScreen(line.tgtPos);

  // Direction: if this edge's origin is the selected node, bright sweeps src→tgt
  // otherwise tgt→src (for nodes that are connected TO the selected node on return)
  const ax = line.originIsSelected ? sp.x : tp.x;
  const ay = line.originIsSelected ? sp.y : tp.y;
  const bx = line.originIsSelected ? tp.x : sp.x;
  const by = line.originIsSelected ? tp.y : sp.y;

  // Stroke width from Cytoscape zoom
  const zoom = cy.zoom();
  const strokeW = 5 * zoom;

  // The "bright front" position along the line: 0 = at origin node, 1 = at far node
  const front = breathT;  // breathT is already 0→1→0→...

  // Build a linear gradient along the exact line segment
  const grad = ctx.createLinearGradient(ax, ay, bx, by);

  const [r, g, b] = line.rgb;

  // Soft tail behind the front
  const tail = Math.max(0, front - 0.35);
  grad.addColorStop(0,              `rgba(${r},${g},${b},0)`);
  grad.addColorStop(Math.max(0, tail), `rgba(${r},${g},${b},0)`);
  grad.addColorStop(Math.min(1, front * 0.75), `rgba(${r},${g},${b},${0.25 + breathT * 0.25})`);
  grad.addColorStop(Math.min(1, front),        `rgba(${r},${g},${b},${0.85 + breathT * 0.15})`);
  // fade to transparent beyond the front
  if (front < 0.98) {
    grad.addColorStop(Math.min(1, front + 0.04), `rgba(${r},${g},${b},0)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  }

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.strokeStyle = grad;
  ctx.lineWidth   = strokeW;
  ctx.lineCap     = 'round';
  ctx.stroke();
  ctx.restore();
}

// ─── MAIN ANIMATION LOOP ─────────────────────────────────────────────────────
function startEnergyLoop(focusedNodes, focusedEdges, clickedNode) {
  stopAllPulse();
  stopRAF();
  breathPhase = 0;

  // Build activeLines — orient each edge so "origin" = clicked node side
  activeLines = [];
  focusedEdges.forEach(edge => {
    const src = edge.source();
    const tgt = edge.target();
    const color = LINE_COLORS[edge.data('line')] || '#ffffff';
    const rgb   = hexRGB(color);
    // Determine which end touches the clicked (or same-group selected) node
    // For simplicity: if source is the clicked node → originIsSelected true
    // Otherwise treat target side as origin (energy flows tgt→src direction = toward selected)
    // We want exhale = away from selected, inhale = toward selected.
    // So originIsSelected = source is the clicked node; draw bright from src→tgt on exhale.
    const originIsSelected = src.id() === clickedNode.id();
    activeLines.push({
      srcPos: { x: src.position('x'), y: src.position('y') },
      tgtPos: { x: tgt.position('x'), y: tgt.position('y') },
      color, rgb, originIsSelected
    });
  });

  function tick() {
    rafId = requestAnimationFrame(tick);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Advance breath: full cycle ~3.5 sec
    breathPhase += 0.018;
    // Convert to 0→1→0 triangle wave (exhale then inhale)
    const raw = (Math.sin(breathPhase - Math.PI / 2) + 1) / 2; // 0→1→0
    const breathT = raw; // 0 = fully inhaled (at node), 1 = fully exhaled (at far end)

    // Pulse node glow in sync: bright on exhale (breathT=1), dim on inhale (breathT=0)
    focusedNodes.forEach(n => {
      if (n.hasClass('dim')) return;
      const base = getBaseSize(n);
      n.style('shadow-blur',  (base * 0.3 + breathT * base * 0.8).toString());
      n.style('border-width', (2 + breathT * 4).toString());
    });

    // Draw every active edge's breath gradient
    activeLines.forEach(line => drawEdgeBreath(line, breathT));
  }

  rafId = requestAnimationFrame(tick);
}

// ─── IDLE PULSE ───────────────────────────────────────────────────────────────
function startIdlePulse() {
  stopAllPulse();
  stopRAF();
  let phase = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    phase += 0.025;
    cy.nodes().forEach(n => {
      if (n !== hoveredNode) {
        const base = getBaseSize(n) * 0.4;
        n.style('shadow-blur', (base + Math.sin(phase + n.position('x') * 0.002) * 10).toString());
      }
    });
  }, 60);
  pulseTimers.push(id);
}

// ─── CLICK ────────────────────────────────────────────────────────────────────
cy.on('tap', 'node', function(evt) {
  const clicked = evt.target;

  if (focusActive && clicked.hasClass('focus-node') && !clicked.hasClass('dim')) {
    resetAll(); return;
  }

  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  const visited = new Set([clicked.id()]);
  const queue   = [clicked];
  let focNodes  = cy.collection();
  let focEdges  = cy.collection();

  clicked.removeClass('dim').addClass('focus-node');
  focNodes = focNodes.merge(clicked);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id());
          queue.push(n);
          n.removeClass('dim').addClass('focus-node');
          focNodes = focNodes.merge(n);
        }
      });
      edge.removeClass('dim').addClass('focus-edge');
      focEdges = focEdges.merge(edge);
    });
  }

  focusActive  = true;
  selectedNode = clicked;

  cy.animate({
    fit: { eles: focNodes, padding: Math.min(window.innerWidth, window.innerHeight) * 0.12 }
  }, { duration: 550, easing: 'ease-in-out-cubic' });

  startEnergyLoop(focNodes, focEdges, clicked);
});

// ─── BG TAP RESET ─────────────────────────────────────────────────────────────
cy.on('tap', function(e) { if (e.target === cy) resetAll(); });

function resetAll() {
  stopAllPulse();
  stopRAF();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().forEach(n => { n.style('shadow-blur', ''); n.style('border-width', '2'); });
  focusActive  = false;
  selectedNode = null;
  cy.animate({ fit: { eles: cy.nodes(), padding: 60 } }, { duration: 500, easing: 'ease-in-out-cubic' });
  startIdlePulse();
}

// ─── HOVER ────────────────────────────────────────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = node;
  if (node.hasClass('dim')) return;
  node.addClass('hovered');
  const big = node.data('type') === 'participant' ? 120 : 90;
  node.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});
cy.on('mouseout', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = null;
  node.removeClass('hovered');
  node.stop().animate({ style: { width: getBaseSize(node), height: getBaseSize(node) } }, { duration: 180 });
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
startIdlePulse();
</script>
</body>
</html>
