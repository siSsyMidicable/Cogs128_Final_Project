<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#cy { width: 100%; height: 100%; position: absolute; }
#glass {
  position: absolute; top: 18px; left: 18px; width: 260px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="cy"></div>

<div id="glass">
  <h1>Trust Exchange</h1>
  <p class="hint">Click a node to focus · Click background to reset</p>
  <div class="legend">
    <div class="item"><div class="dot" style="background:#38bdf8"></div>Participant</div>
    <div class="item"><div class="dot" style="background:#00ffa6"></div>Skill</div>
    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>
  </div>
</div>

<script>
// ─── Legend auto-hide ────────────────────────────────────────────
const glass = document.getElementById('glass');
showGlass();
let hideT = setTimeout(hideGlass, 3500);
function hideGlass(){ glass.classList.add('hidden'); }
function showGlass(){ glass.classList.remove('hidden'); }
glass.addEventListener('mouseenter', () => { clearTimeout(hideT); showGlass(); });
glass.addEventListener('mouseleave', () => { hideT = setTimeout(hideGlass, 2000); });

// ─── Node base sizes ─────────────────────────────────────────────
const BASE = { participant: 90, trust: 42, fairness: 42, skill: 34 };
const HOVER_SIZE = 115;

// ─── Cytoscape ───────────────────────────────────────────────────
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [
    // PARTICIPANTS
    { data:{ id:'alex',    label:'Alex',    type:'participant' }, position:{ x:900,  y:550  } },
    { data:{ id:'maria',   label:'Maria',   type:'participant' }, position:{ x:1200, y:470  } },
    { data:{ id:'daniel',  label:'Daniel',  type:'participant' }, position:{ x:1450, y:620  } },
    { data:{ id:'jasmine', label:'Jasmine', type:'participant' }, position:{ x:1050, y:800  } },
    { data:{ id:'kevin',   label:'Kevin',   type:'participant' }, position:{ x:1400, y:900  } },
    { data:{ id:'lina',    label:'Lina',    type:'participant' }, position:{ x:1750, y:760  } },
    { data:{ id:'marcus',  label:'Marcus',  type:'participant' }, position:{ x:1900, y:1020 } },
    { data:{ id:'emily',   label:'Emily',   type:'participant' }, position:{ x:2100, y:620  } },
    { data:{ id:'robert',  label:'Robert',  type:'participant' }, position:{ x:1700, y:340  } },
    { data:{ id:'linda',   label:'Linda',   type:'participant' }, position:{ x:2250, y:900  } },
    // SKILLS
    { data:{ id:'resume',      label:'Resume Formatting', type:'skill' }, position:{ x:500,  y:450  } },
    { data:{ id:'calc',        label:'Calc Study Help',   type:'skill' }, position:{ x:450,  y:650  } },
    { data:{ id:'logos',       label:'Logos',             type:'skill' }, position:{ x:850,  y:250  } },
    { data:{ id:'branding',    label:'Branding Advice',   type:'skill' }, position:{ x:1100, y:180  } },
    { data:{ id:'photography', label:'Photography',       type:'skill' }, position:{ x:1350, y:150  } },
    { data:{ id:'website',     label:'Website Help',      type:'skill' }, position:{ x:1600, y:170  } },
    { data:{ id:'repair',      label:'Computer Repair',   type:'skill' }, position:{ x:1850, y:250  } },
    { data:{ id:'wifi',        label:'Wi-Fi Issues',      type:'skill' }, position:{ x:2050, y:350  } },
    { data:{ id:'home',        label:'Home Repairs',      type:'skill' }, position:{ x:2250, y:480  } },
    { data:{ id:'homework',    label:'Homework Help',     type:'skill' }, position:{ x:700,  y:1050 } },
    { data:{ id:'notes',       label:'Sharing Notes',     type:'skill' }, position:{ x:900,  y:1180 } },
    { data:{ id:'bookkeeping', label:'Bookkeeping',       type:'skill' }, position:{ x:1200, y:1220 } },
    { data:{ id:'consulting',  label:'Consulting',        type:'skill' }, position:{ x:1450, y:1250 } },
    { data:{ id:'marketing',   label:'Marketing Advice',  type:'skill' }, position:{ x:1700, y:1220 } },
    { data:{ id:'photoshoots', label:'Photoshoots',       type:'skill' }, position:{ x:1950, y:1180 } },
    { data:{ id:'gym',         label:'Gym Training',      type:'skill' }, position:{ x:2250, y:1120 } },
    // TRUST
    { data:{ id:'reviews',       label:'Reviews',       type:'trust' }, position:{ x:800,  y:40 } },
    { data:{ id:'verification',  label:'Verification',  type:'trust' }, position:{ x:1100, y:40 } },
    { data:{ id:'portfolio',     label:'Portfolio',     type:'trust' }, position:{ x:1400, y:40 } },
    { data:{ id:'communication', label:'Communication', type:'trust' }, position:{ x:1700, y:40 } },
    { data:{ id:'reputation',    label:'Reputation',    type:'trust' }, position:{ x:2000, y:40 } },
    { data:{ id:'trackrecord',   label:'Track Record',  type:'trust' }, position:{ x:2300, y:40 } },
    // FAIRNESS
    { data:{ id:'effort',       label:'Effort',       type:'fairness' }, position:{ x:650,  y:1450 } },
    { data:{ id:'balanced',     label:'Balanced',     type:'fairness' }, position:{ x:950,  y:1450 } },
    { data:{ id:'agreement',    label:'Agreement',    type:'fairness' }, position:{ x:1250, y:1450 } },
    { data:{ id:'worthit',      label:'Worth It',     type:'fairness' }, position:{ x:1550, y:1450 } },
    { data:{ id:'consistency',  label:'Consistency',  type:'fairness' }, position:{ x:1850, y:1450 } },
    { data:{ id:'expectations', label:'Expectations', type:'fairness' }, position:{ x:2150, y:1450 } },
    // EDGES
    { data:{ source:'alex',    target:'resume',      line:'skill'    } },
    { data:{ source:'alex',    target:'calc',        line:'skill'    } },
    { data:{ source:'alex',    target:'reviews',     line:'trust'    } },
    { data:{ source:'alex',    target:'effort',      line:'fairness' } },
    { data:{ source:'maria',   target:'logos',       line:'skill'    } },
    { data:{ source:'maria',   target:'branding',    line:'skill'    } },
    { data:{ source:'maria',   target:'photography', line:'skill'    } },
    { data:{ source:'maria',   target:'portfolio',   line:'trust'    } },
    { data:{ source:'maria',   target:'balanced',    line:'fairness' } },
    { data:{ source:'daniel',  target:'repair',      line:'skill'    } },
    { data:{ source:'daniel',  target:'wifi',        line:'skill'    } },
    { data:{ source:'daniel',  target:'verification',line:'trust'    } },
    { data:{ source:'daniel',  target:'agreement',   line:'fairness' } },
    { data:{ source:'jasmine', target:'homework',    line:'skill'    } },
    { data:{ source:'jasmine', target:'notes',       line:'skill'    } },
    { data:{ source:'jasmine', target:'worthit',     line:'fairness' } },
    { data:{ source:'kevin',   target:'bookkeeping', line:'skill'    } },
    { data:{ source:'kevin',   target:'consulting',  line:'skill'    } },
    { data:{ source:'kevin',   target:'marketing',   line:'skill'    } },
    { data:{ source:'kevin',   target:'trackrecord', line:'trust'    } },
    { data:{ source:'lina',    target:'photoshoots', line:'skill'    } },
    { data:{ source:'lina',    target:'communication',line:'trust'   } },
    { data:{ source:'lina',    target:'expectations',line:'fairness' } },
    { data:{ source:'marcus',  target:'gym',         line:'skill'    } },
    { data:{ source:'marcus',  target:'consistency', line:'fairness' } },
    { data:{ source:'emily',   target:'reputation',  line:'trust'    } },
    { data:{ source:'robert',  target:'verification',line:'trust'    } },
    { data:{ source:'robert',  target:'agreement',   line:'fairness' } },
    { data:{ source:'linda',   target:'communication',line:'trust'   } },
    { data:{ source:'linda',   target:'expectations',line:'fairness' } }
  ],
  style: [
    // BASE NODE
    {
      selector: 'node',
      style: {
        'label': 'data(label)',
        'font-size': 11,
        'font-weight': 600,
        'text-wrap': 'wrap',
        'text-max-width': '100px',
        'color': 'white',
        'text-outline-width': 3,
        'text-outline-color': '#000',
        'text-valign': 'center',
        'text-halign': 'center',
        'border-width': 2,
        'border-color': 'rgba(255,255,255,0.15)',
        'transition-property': 'opacity, width, height, font-size, text-outline-width, border-width, shadow-blur',
        'transition-duration': '300ms'
      }
    },
    // PARTICIPANT
    { selector: 'node[type="participant"]', style: {
      'background-color': '#38bdf8', 'width': 90, 'height': 90,
      'shadow-color': '#38bdf8', 'shadow-blur': 40, 'shadow-opacity': 1
    }},
    // SKILL
    { selector: 'node[type="skill"]', style: {
      'background-color': '#00ffa6', 'width': 34, 'height': 34,
      'shadow-color': '#00ffa6', 'shadow-blur': 18, 'shadow-opacity': 0.8
    }},
    // TRUST
    { selector: 'node[type="trust"]', style: {
      'background-color': '#ffb347', 'width': 42, 'height': 42,
      'shadow-color': '#ffb347', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    // FAIRNESS
    { selector: 'node[type="fairness"]', style: {
      'background-color': '#ff4fa3', 'width': 42, 'height': 42,
      'shadow-color': '#ff4fa3', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    // EDGES
    { selector: 'edge', style: {
      'curve-style': 'segments',
      'segment-distances': '40 -40 40', 'segment-weights': '0.2 0.5 0.8',
      'width': 5, 'opacity': 0.85, 'line-cap': 'round',
      'transition-property': 'opacity, width, shadow-blur',
      'transition-duration': '300ms'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6', 'shadow-color': '#00ffa6', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347', 'shadow-color': '#ffb347', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3', 'shadow-color': '#ff4fa3', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },

    // ── DIM: everything goes nearly invisible ──────────────────
    { selector: '.dim', style: {
      'opacity': 0.06,
      'text-opacity': 0
    }},

    // ── FOCUSED NODE: full bright + bigger font + thick border ──
    { selector: '.focus-node', style: {
      'opacity': 1,
      'font-size': 15,
      'font-weight': 800,
      'text-outline-width': 4,
      'text-outline-color': '#000',
      'color': '#ffffff',
      'border-width': 4,
      'border-color': 'rgba(255,255,255,0.7)',
      'shadow-blur': 60,
      'shadow-opacity': 1,
      'text-opacity': 1
    }},

    // ── FOCUSED EDGE: full bright + wider ─────────────────────
    { selector: '.focus-edge', style: {
      'opacity': 1,
      'width': 7,
      'shadow-blur': 20,
      'shadow-opacity': 0.9
    }},

    // ── HOVER: font pops, node grows, glow intensifies ────────
    { selector: '.hovered', style: {
      'font-size': 17,
      'font-weight': 900,
      'text-outline-width': 5,
      'text-outline-color': '#000',
      'color': '#ffffff',
      'text-opacity': 1,
      'border-width': 4,
      'border-color': 'rgba(255,255,255,0.9)',
      'shadow-blur': 70,
      'shadow-opacity': 1
    }}
  ],
  layout: { name: 'preset' }
});

// ─── State ───────────────────────────────────────────────────────
let focusActive  = false;   // true while a node selection is active
let pulseTimers  = [];      // active setInterval IDs for breathing pulse
let hoveredNode  = null;    // currently hovered node

// ─── Helpers ─────────────────────────────────────────────────────
function getBaseSize(node) {
  return BASE[node.data('type')] || 42;
}

function stopAllPulse() {
  pulseTimers.forEach(id => clearInterval(id));
  pulseTimers = [];
}

// Breathing pulse: selected nodes gently scale up/down in opacity
function startPulse(nodes) {
  stopAllPulse();
  let phase = 0;
  const id = setInterval(() => {
    phase += 0.07;
    const glow = 0.82 + Math.sin(phase) * 0.18; // oscillates 0.64 ↔ 1.0
    nodes.forEach(n => {
      if (!n.hasClass('dim')) {
        n.style('shadow-blur', (getBaseSize(n) * 0.7 + Math.sin(phase) * 20).toString());
        n.style('border-width', (3 + Math.sin(phase) * 2).toString());
      }
    });
  }, 50);
  pulseTimers.push(id);
}

// ─── CLICK: focus / dim ──────────────────────────────────────────
cy.on('tap', 'node', function(evt) {
  const start = evt.target;

  // If clicking the already-focused node, toggle off
  if (focusActive && start.hasClass('focus-node') && !start.hasClass('dim')) {
    resetAll();
    return;
  }

  stopAllPulse();
  cy.elements().removeClass('dim focus-node focus-edge hovered');

  // Dim everything first
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  // BFS from clicked node
  const visited  = new Set([start.id()]);
  const queue    = [start];
  const selected = cy.collection();

  start.removeClass('dim');
  start.addClass('focus-node');
  selected.merge(start);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id());
          queue.push(n);
          n.removeClass('dim');
          n.addClass('focus-node');
          selected.merge(n);
        }
        edge.removeClass('dim');
        edge.addClass('focus-edge');
      });
    });
  }

  focusActive = true;
  startPulse(selected);
});

// ─── BACKGROUND TAP: reset ───────────────────────────────────────
cy.on('tap', function(e) {
  if (e.target === cy) resetAll();
});

function resetAll() {
  stopAllPulse();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  focusActive = false;
  // restart gentle idle pulse on everything
  startIdlePulse();
}

// ─── HOVER: font pop + size grow ────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = node;
  // Don't show hover on dimmed nodes
  if (node.hasClass('dim')) return;
  node.addClass('hovered');
  const big = node.data('type') === 'participant' ? HOVER_SIZE + 20 : HOVER_SIZE;
  node.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});

cy.on('mouseout', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = null;
  node.removeClass('hovered');
  const s = getBaseSize(node);
  node.stop().animate({ style: { width: s, height: s } }, { duration: 180 });
});

// ─── IDLE PULSE: gentle ambient glow when nothing selected ───────
function startIdlePulse() {
  if (focusActive) return;
  let phase = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    phase += 0.025;
    cy.nodes().forEach(n => {
      if (!n.hasClass('dim') && n !== hoveredNode) {
        const base = getBaseSize(n) * 0.4;
        n.style('shadow-blur', (base + Math.sin(phase + n.position('x') * 0.002) * 12).toString());
      }
    });
  }, 60);
  pulseTimers.push(id);
}

startIdlePulse();
</script>
</body>
</html>
