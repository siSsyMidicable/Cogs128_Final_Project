<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Exchange Railway Map</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: radial-gradient(circle at center, #1a2338 0%, #0d1320 35%, #05080f 70%, #000 100%);
}
#scene {
  width: 100%; height: 100%;
  perspective: 1800px;
  perspective-origin: 50% 50%;
}
#stage {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}
#cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
#energy-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#glass {
  position: fixed; top: 18px; left: 18px; width: 260px;
  padding: 16px; z-index: 999; border-radius: 18px; color: white;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,0,0,0.35);
  transition: opacity 0.4s ease;
}
#glass.hidden { opacity: 0; pointer-events: none; }
h1 { margin-top: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
.legend { margin-top: 10px; }
.item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 9px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="scene">
  <div id="stage">
    <div id="cy"></div>
    <canvas id="energy-canvas"></canvas>
  </div>
</div>

<div id="glass">
  <h1>Trust Exchange</h1>
  <p class="hint">Click a node to focus · Click background to reset</p>
  <div class="legend">
    <div class="item"><div class="dot" style="background:#38bdf8"></div>Participant</div>
    <div class="item"><div class="dot" style="background:#00ffa6"></div>Skill</div>
    <div class="item"><div class="dot" style="background:#ffb347"></div>Trust</div>
    <div class="item"><div class="dot" style="background:#ff4fa3"></div>Fairness</div>
  </div>
</div>

<script>
// ─── Legend fade ───────────────────────────────────────────────────────────────

glass.addEventListener('mouseenter', () => { clearTimeout(hideT); glass.classList.remove('hidden'); });

  ],

      }
    },
    { selector: 'node[type="participant"]', style: {

      'shadow-color': '#38bdf8', 'shadow-blur': 40, 'shadow-opacity': 1
    }},
    { selector: 'node[type="skill"]', style: {

    }},
    { selector: 'node[type="trust"]', style: {
      'background-color': '#ffb347', 'width': 42, 'height': 42,
      'shadow-color': '#ffb347', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    { selector: 'node[type="fairness"]', style: {
      'background-color': '#ff4fa3', 'width': 42, 'height': 42,
      'shadow-color': '#ff4fa3', 'shadow-blur': 25, 'shadow-opacity': 0.9
    }},
    { selector: 'edge', style: {
      'curve-style': 'segments',
      'segment-distances': '40 -40 40', 'segment-weights': '0.2 0.5 0.8',
      'width': 5, 'opacity': 0.85, 'line-cap': 'round',
      'transition-property': 'opacity, width, shadow-blur',
      'transition-duration': '300ms'
    }},
    { selector: 'edge[line="skill"]',    style: { 'line-color': '#00ffa6', 'shadow-color': '#00ffa6', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="trust"]',    style: { 'line-color': '#ffb347', 'shadow-color': '#ffb347', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: 'edge[line="fairness"]', style: { 'line-color': '#ff4fa3', 'shadow-color': '#ff4fa3', 'shadow-blur': 10, 'shadow-opacity': 0.5 } },
    { selector: '.dim', style: { 'opacity': 0.06, 'text-opacity': 0 } },
    { selector: '.focus-node', style: {
      'opacity': 1, 'font-size': 15, 'font-weight': 800,

      'color': '#ffffff', 'border-width': 4,

    }},

    { selector: '.hovered', style: {
      'font-size': 17, 'font-weight': 900,
      'text-outline-width': 5, 'text-outline-color': '#000',
      'color': '#ffffff', 'text-opacity': 1,

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('energy-canvas');
const ctx    = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function toScreen(pos) {
  const p = cy.pan(), z = cy.zoom();
  return { x: pos.x * z + p.x, y: pos.y * z + p.y };
}
function hexRGB(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function getBaseSize(n) { return BASE[n.data('type')] || 42; }

// ─── Build the actual curved polyline for a segments-style edge ───────────────
function buildEdgePolyline(edge) {
  const src = edge.source().position();
  const tgt = edge.target().position();
  const dx = tgt.x - src.x;
  const dy = tgt.y - src.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = -dy / len;
  const py =  dx / len;
  const weights = [0.2, 0.5, 0.8];
  const dists   = [40, -40, 40];
  const pts = [];
  pts.push({ x: src.x, y: src.y });
  for (let i = 0; i < weights.length; i++) {
    pts.push({
      x: src.x + weights[i] * dx + dists[i] * px,
      y: src.y + weights[i] * dy + dists[i] * py
    });
  }
  pts.push({ x: tgt.x, y: tgt.y });
  return pts;
}

function buildArcTable(pts) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i-1].x;
    const dy = pts[i].y - pts[i-1].y;
    const d  = Math.sqrt(dx*dx + dy*dy);
    total += d;
    segs.push({ len: d, cumLen: total });
  }
  return { segs, total };
}

function evalPolyline(pts, arc, t) {
  const target = t * arc.total;
  let prev = 0;
  for (let i = 0; i < arc.segs.length; i++) {
    const { len, cumLen } = arc.segs[i];
    if (target <= cumLen || i === arc.segs.length - 1) {
      const f = len > 0 ? (target - prev) / len : 0;
      const p0 = pts[i],  p1 = pts[i+1];
      return {
        x: p0.x + f * (p1.x - p0.x),
        y: p0.y + f * (p1.y - p0.y)
      };
    }
    prev = cumLen;
  }
  return pts[pts.length - 1];
}

// ─── State ────────────────────────────────────────────────────────────────────
let focusActive = false;
let pulseTimers = [];
let hoveredNode = null;
let rafId       = null;
let breathPhase = 0;
let activeEdgeData = [];

function stopAllPulse() { pulseTimers.forEach(clearInterval); pulseTimers = []; }
function stopRAF() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ─── Draw a train light running INSIDE the tunnel (edge line) ─────────────────
// Paints a tight stroked trail that follows the polyline path exactly —
// no radial blobs, no glow escaping outside the track width.
function drawTunnelLight(edgeData, breathT, zoom) {
  const { pts, arc, rgb, srcRadius, edgeWidth } = edgeData;

  const startT = Math.min(srcRadius / arc.total, 0.08);
  const endT   = 1.0;
  const t      = startT + breathT * (endT - startT);

  const world = evalPolyline(pts, arc, t);
  const sc    = toScreen(world);
  const [r, g, b] = rgb;

  // Edge half-width in screen space — light stays inside this boundary
  const hw = (edgeWidth * zoom) / 2;

  // ── Trail: short stroked segments following the track curve ──
  const TRAIL_STEPS = 18;
  const TRAIL_LENGTH = 0.18;

  for (let i = TRAIL_STEPS; i >= 0; i--) {
    const tTrail = Math.max(startT, t - (i / TRAIL_STEPS) * TRAIL_LENGTH);
    const tNext  = Math.max(startT, t - ((i - 1) / TRAIL_STEPS) * TRAIL_LENGTH);
    if (tTrail >= tNext) continue;

    const wA = evalPolyline(pts, arc, tTrail);
    const wB = evalPolyline(pts, arc, tNext);
    const sA = toScreen(wA);
    const sB = toScreen(wB);

    const frac  = 1 - (i / TRAIL_STEPS);
    const alpha = frac * frac * 0.95;

    ctx.save();
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = hw * 2 * (0.4 + frac * 0.6);
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.beginPath();
    ctx.moveTo(sA.x, sA.y);
    ctx.lineTo(sB.x, sB.y);
    ctx.stroke();
    ctx.restore();
  }

  // ── Head: tight white-cored dot clipped to edge width ──
  const coreR = hw * 0.9;
  ctx.save();
  ctx.beginPath();
  ctx.arc(sc.x, sc.y, coreR, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${0.85 + breathT * 0.15})`;
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.arc(sc.x, sc.y, coreR * 1.6, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${r},${g},${b},0.55)`;
  ctx.fill();
  ctx.restore();
}

// ─── Energy loop ──────────────────────────────────────────────────────────────
function startEnergyLoop(focusedNodes, focusedEdges, clickedNode) {
  stopAllPulse();
  stopRAF();
  breathPhase = 0;

  const clickedSize = getBaseSize(clickedNode) / 2;

  activeEdgeData = [];
  focusedEdges.forEach(edge => {
    const src   = edge.source();
    const color = LINE_COLORS[edge.data('line')] || '#ffffff';
    const rgb   = hexRGB(color);

    let pts = buildEdgePolyline(edge);
    if (src.id() !== clickedNode.id()) pts = pts.slice().reverse();

    const arc = buildArcTable(pts);
    const edgeWidth = 7;
    activeEdgeData.push({ pts, arc, rgb, srcRadius: clickedSize, edgeWidth });
  });

  function tick() {
    rafId = requestAnimationFrame(tick);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    breathPhase += 0.016;
    const breathT = (Math.sin(breathPhase - Math.PI / 2) + 1) / 2;

    focusedNodes.forEach(n => {
      if (n.hasClass('dim')) return;
      const base = getBaseSize(n);
      n.style('shadow-blur',  (base * 0.4 + breathT * base * 0.8).toString());
      n.style('border-width', (2 + breathT * 4).toString());
    });

    const zoom = cy.zoom();
    activeEdgeData.forEach(ed => drawTunnelLight(ed, breathT, zoom));
  }

  rafId = requestAnimationFrame(tick);
}

// ─── Idle pulse ───────────────────────────────────────────────────────────────
function startIdlePulse() {
  stopAllPulse();
  stopRAF();
  let phase = 0;
  const id = setInterval(() => {
    if (focusActive) { clearInterval(id); return; }
    phase += 0.025;
    cy.nodes().forEach(n => {
      if (n !== hoveredNode) {
        const base = getBaseSize(n) * 0.4;
        n.style('shadow-blur', (base + Math.sin(phase + n.position('x') * 0.002) * 10).toString());
      }
    });
  }, 60);
  pulseTimers.push(id);
}

// ─── Z-axis universe drift ────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let driftPhase = 0;
const DRIFT_SPEED = 0.00028;
const MAX_X = 6;
const MAX_Y = 9;

function driftTick() {
  requestAnimationFrame(driftTick);
  driftPhase += DRIFT_SPEED;
  const rx = MAX_X * Math.sin(driftPhase * 1.0);
  const ry = MAX_Y * Math.sin(driftPhase * 0.7 + 1.1);
  stage.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
}
driftTick();

// ─── Click ────────────────────────────────────────────────────────────────────
cy.on('tap', 'node', function(evt) {
  const clicked = evt.target;
  if (focusActive && clicked.hasClass('focus-node') && !clicked.hasClass('dim')) {
    resetAll(); return;
  }

  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');

  const visited = new Set([clicked.id()]);
  const queue   = [clicked];
  let focNodes  = cy.collection();
  let focEdges  = cy.collection();

  clicked.removeClass('dim').addClass('focus-node');
  focNodes = focNodes.merge(clicked);

  while (queue.length) {
    const node = queue.shift();
    node.connectedEdges().forEach(edge => {
      edge.connectedNodes().forEach(n => {
        if (!visited.has(n.id())) {
          visited.add(n.id());
          queue.push(n);
          n.removeClass('dim').addClass('focus-node');
          focNodes = focNodes.merge(n);
        }
      });
      edge.removeClass('dim').addClass('focus-edge');
      focEdges = focEdges.merge(edge);
    });
  }

  focusActive = true;

  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.12;
  cy.animate(
    { fit: { eles: focNodes, padding: pad } },
    { duration: 600, easing: 'ease-in-out-cubic' }
  );

  startEnergyLoop(focNodes, focEdges, clicked);
});

cy.on('tap', function(e) { if (e.target === cy) resetAll(); });

function resetAll() {
  stopAllPulse();
  stopRAF();
  cy.elements().removeClass('dim focus-node focus-edge hovered');
  cy.nodes().forEach(n => { n.style('shadow-blur', ''); n.style('border-width', '2'); });
  focusActive = false;
  const pad = Math.min(window.innerWidth, window.innerHeight) * 0.07;
  cy.animate(
    { fit: { eles: cy.nodes(), padding: pad } },
    { duration: 500, easing: 'ease-in-out-cubic' }
  );
  startIdlePulse();
}

// ─── Hover ────────────────────────────────────────────────────────────────────
cy.on('mouseover', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = node;
  if (node.hasClass('dim')) return;
  node.addClass('hovered');
  const big = node.data('type') === 'participant' ? HOVER_SIZE + 20 : HOVER_SIZE;
  node.stop().animate({ style: { width: big, height: big } }, { duration: 180 });
});
cy.on('mouseout', 'node', function(evt) {
  const node = evt.target;
  hoveredNode = null;
  node.removeClass('hovered');
  node.stop().animate({ style: { width: getBaseSize(node), height: getBaseSize(node) } }, { duration: 180 });
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
startIdlePulse();
</script>
