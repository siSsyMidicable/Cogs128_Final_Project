# ────────────────────────────────────────────────────────────────
# Cogs128 Final Project — Static GitHub Pages Deploy
# No build step needed — serves index.html + assets directly
# ────────────────────────────────────────────────────────────────
name: Deploy to Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Assemble the dist folder from static files only
      - name: Assemble static dist
        run: |
          mkdir -p dist/assets dist/docs
          cp index.html dist/index.html
          cp -r assets/. dist/assets/
          cp docs/FINAL_REPORT.md dist/docs/FINAL_REPORT.md || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
