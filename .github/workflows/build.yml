# ────────────────────────────────────────────────────────────────
# Cogs128 Final Project — CI Build + GitHub Pages Deploy
# Node.js 24-ready
# ────────────────────────────────────────────────────────────────
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate concurrency groups so build and deploy never cancel each other
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Build, typecheck, and export web bundle
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Export Web
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # ── Client dependencies ────────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # ── Fix expo-router version for Expo 54 ────────────────────
      - name: Fix expo-router version
        working-directory: client
        run: npx expo install expo-router
        continue-on-error: true

      # ── TypeScript typecheck ───────────────────────────────────
      - name: TypeScript typecheck
        working-directory: client
        run: npx tsc --noEmit
        continue-on-error: true

      # ── Expo web export ────────────────────────────────────────
      - name: Export web bundle
        working-directory: client
        run: npx expo export --platform web
        env:
          NODE_ENV: production

      # ── Copy extra assets (graph, docs) into dist ──────────────
      - name: Copy assets into dist
        run: |
          mkdir -p client/dist/assets
          cp assets/trust-exchange-graph.html client/dist/trust-exchange-graph.html || true
          cp assets/skillswap_3d_clean.html   client/dist/skillswap_3d_clean.html   || true

      # ── Upload Pages artifact ──────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      # ── Also upload client source for debugging ────────────────
      - name: Upload client source artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/
          retention-days: 7

      # ── Server dependencies ────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages (only on push to main)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
