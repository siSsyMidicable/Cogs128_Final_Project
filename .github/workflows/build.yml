# ────────────────────────────────────────────────────────────────
name: Deploy to Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node (for marked CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install marked
        run: npm install -g marked

      # Assemble the dist folder
      - name: Assemble static dist
        run: |
          mkdir -p dist/assets dist/docs
          cp index.html dist/index.html
          cp -r assets/. dist/assets/

      # Render FINAL_REPORT.md → FINAL_REPORT.html
      - name: Render Final Report as HTML
        run: |
          BODY=$(marked --gfm docs/FINAL_REPORT.md)
          cat > dist/docs/FINAL_REPORT.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SkillSwap — COGS 128 Final Report</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: Inter, system-ui, sans-serif;
                background: #05080f;
                color: #c9d1de;
                padding: 48px 24px 120px;
                max-width: 820px;
                margin: 0 auto;
                line-height: 1.75;
              }
              h1 { font-size: 2.2rem; font-weight: 900; color: #e2e8f0; margin: 0 0 8px; }
              h2 { font-size: 1.3rem; font-weight: 800; color: #38bdf8; margin: 48px 0 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
              h3 { font-size: 1rem; font-weight: 700; color: #94a3b8; margin: 28px 0 8px; }
              p  { margin-bottom: 14px; color: #94a3b8; }
              a  { color: #38bdf8; text-decoration: none; }
              a:hover { text-decoration: underline; }
              strong { color: #cbd5e1; }
              em { color: #64748b; }
              blockquote {
                border-left: 3px solid #38bdf8;
                padding: 10px 16px;
                margin: 20px 0;
                background: #080c14;
                color: #64748b;
                font-size: 0.88rem;
              }
              table {
                width: 100%;
                border-collapse: collapse;
                margin: 20px 0;
                font-size: 0.82rem;
              }
              th {
                background: #0d1120;
                color: #38bdf8;
                font-weight: 700;
                text-align: left;
                padding: 8px 12px;
                border: 1px solid #1e293b;
                letter-spacing: 0.06em;
                font-size: 0.75rem;
                text-transform: uppercase;
              }
              td {
                padding: 8px 12px;
                border: 1px solid #1e293b;
                color: #94a3b8;
                vertical-align: top;
              }
              tr:nth-child(even) td { background: #080c14; }
              code {
                background: #0d1120;
                color: #00ffa6;
                padding: 1px 5px;
                border-radius: 3px;
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.85em;
              }
              pre {
                background: #080c14;
                border-left: 3px solid #1e293b;
                padding: 16px;
                overflow-x: auto;
                margin: 20px 0;
              }
              pre code { background: none; padding: 0; }
              hr { border: none; border-top: 1px solid #1e293b; margin: 40px 0; }
              ul, ol { padding-left: 24px; margin-bottom: 14px; color: #94a3b8; }
              li { margin-bottom: 6px; }
              .back {
                display: inline-block;
                margin-bottom: 40px;
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.78rem;
                color: #38bdf8;
                text-decoration: none;
                letter-spacing: 0.08em;
              }
              .back:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <a class="back" href="../index.html">← Back to SkillSwap</a>
          HTMLEOF
          echo "$BODY" >> dist/docs/FINAL_REPORT.html
          echo "</body></html>" >> dist/docs/FINAL_REPORT.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
