# ────────────────────────────────────────────────────────────────
# Cogs128 Final Project — CI Build
# Node.js 24-ready • does NOT interfere with Pages deployment
# ────────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each workflow gets its own concurrency group scoped by workflow file
# + branch. Only runs from THIS workflow cancel each other on rapid
# pushes. The Pages deployment workflow runs in a separate group and
# is never touched by this one.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 now so the June 2026 forced migration is a no-op
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # ── Client dependencies ────────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # ── TypeScript typecheck ───────────────────────────────────
      - name: TypeScript typecheck
        working-directory: client
        run: npx tsc --noEmit
        continue-on-error: true

      # ── Server dependencies ────────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # ── Upload build artifacts ─────────────────────────────────
      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/
          retention-days: 7
